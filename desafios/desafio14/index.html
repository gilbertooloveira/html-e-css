<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
   <style>body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;

        }
        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }
        th,td{
            border: 1px solid black;
            padding: 10px;
            width: 100px;
            text-align: center;
        }
        </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Area</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Médias</th>
                
                
            </tr>
            
        </thead>
        <tbody>
            <tr>
                <th>Exatas</th>
                <td>Matematica</td>
                <td>8.5</td>
               <td> 7.5</td>
               <td>16.0</td>
            </tr>
            <tr>
                <td>Fisica</td>
                <td>7.0</td>
                <td>7.5</td>
                <td>14.5</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>6.0</td>
                <td>5.5</td>
                <td>11.5</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>7.5</td>
                <td>6.5</td>
                <td>14.0</td>
            </tr>
            <tr>
                <th colspan="4">Médias de Exatas </th>
                <td>56.0</td>
            </tr>
            <tr>
                <th rowspan="2" >Humanas</th >
                <td>História</td>
                <td>9.5</td>
                <td>9.0</td>
                <td>18.5</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>10.0</td>
                <td>10.0</td>
                <td>20.0</td>
            </tr>
            <tr>
                <th colspan="4" >Média de Humanas</th>
                <td>38.5</td>
            </tr>
            

        </tbody>
    </table>
</body>
</html>
