<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
   <style>body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;

        }
        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }
        th,td{
            border: 1px solid black;
            padding: 10px;
            width: 100px;
            text-align: center;

        }
        .h{
            background-color: white;
        }
        th {
            background-color: gray;
         }
        </style>
</head>
<body>
    </table>
   
        <tbody>
             <tr>
                <th rowspan="2">Arias</th>
                <th rowspan="2" colspan="2">Disciplinas<th>
                 <th colspan="2">Notas</th>
                <th rowspan="2">Médias</th>
            </tr>
            <tr>
                <th > 1</th>
               <th>Nota.1</th>
               <th>Nota.2</th>
            </tr>
            <tr>
                 <th class="h" rowspan="3">Exatas </th>
                <td colspan="2">Fisica</td>
                <td>7.0</td>
                <td>7.5</td>
                <td>14.5</td>
            </tr>
            <tr>
                <td colspan="2">Química</td>
                <td>6.0</td>
                <td>5.5</td>
                <td>11.5</td>
            </tr>
            <tr>
                <td colspan="2">Biologia</td>
                <td>7.5</td>
                <td>6.5</td>
                <td>14.0</td>
            </tr>
            <tr>
                <th colspan="5">Médias de Exatas </th>
                <td>56.0</td>
            </tr>
            <tr>
                <th class="h" rowspan="2" >Humanas</th>
                 <td colspan="2">História</td>
                <td>9.5</td>
                <td>9.0</td>
                <td>18.5</td>
            </tr>
            <tr>
                <td colspan="2">Geografia</td>
                <td>10.0</td>
                <td>10.0</td>
                <td>20.0</td>
            </tr>
            <tr>
                <th colspan="5" >Média de Humanas</th>
                <td>38.5</td>
            </tr>
            

        </tbody>
    </table>
</body>
</html>
