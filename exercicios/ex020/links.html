<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*
        # = id
        . = class
        : = pseudo-class
        :: = pseudo-element
        > = cleldren
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited {
           color: darkred; 
           
        }
        a:hover {
            text-decoration: underline;
            color: black;
        }
        a:active{
            color: yellow;
        }
        .especial {
        background-color: rgb(231, 162, 162);
        
        }
        .especial::before{
           content:'⇒';

        }

          .especial::after{
           content:'⇐';
           text-decoration: none;
           font-weight: normal;
           color: darkgray;
        }
    </style>
</head>
<body>
    <h1>personalisando links</h1>
    <ul>
       <li><a href="https://www.instagram.com/gilsatvivensis/" target="_blank">instagram</a></li> 
       <li><a href="https://www.youtube.com/@gilsat4413" target="_blank" class="especial">canal do youtube</a></li>
       <li><a href="https://www.facebook.com/josegilberto.oliveirasilva.7/?locale=pt_BR" target="_blank" class="especial">facebook</a></li>
    </ul>
</body>
</html>
